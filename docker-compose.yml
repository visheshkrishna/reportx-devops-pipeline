services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reportx}
      POSTGRES_USER: ${POSTGRES_USER:-reportx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reportx}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - reportx-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reportx} -d ${POSTGRES_DB:-reportx}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: base
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver,backend,frontend}
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql+asyncpg://reportx:reportx@postgres:5432/reportx}
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com/v1}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_REASONING_EFFORT: ${OPENAI_REASONING_EFFORT:-high}
      OPENAI_MAX_OUTPUT_TOKENS: ${OPENAI_MAX_OUTPUT_TOKENS:-5000}
      OPENAI_TIMEOUT_S: ${OPENAI_TIMEOUT_S:-15}
      OPENAI_USE_RESPONSES: ${OPENAI_USE_RESPONSES:-0}
      ENABLE_OCR: ${ENABLE_OCR:-1}
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:8000}
    command: sh -c "npm run start -- -p 3000 -H 0.0.0.0"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

  announce:
    image: alpine:3.20
    depends_on:
      - backend
      - frontend
    command: >
      sh -c '
        for i in $(seq 1 120); do
          wget -q -O- --header="Host: localhost" http://backend:8000/api/v1/health >/dev/null 2>&1 &&
          wget -q -O- http://frontend:3000 >/dev/null 2>&1 && break;
          sleep 1;
        done;
        echo;
        echo "Frontend: http://localhost:3000";
        echo "Backend:  http://localhost:8000/api/v1/health";
        tail -f /dev/null
      '

networks:
  default:
    driver: bridge

volumes:
  reportx-postgres-data:
