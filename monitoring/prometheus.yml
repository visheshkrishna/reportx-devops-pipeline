global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: reportx-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://host.docker.internal:8000/api/v1/health
        labels: { env: staging, service: backend }
      - targets:
          - http://host.docker.internal:8100/api/v1/health
        labels: { env: production, service: backend }
      - targets:
          - http://host.docker.internal:3000
        labels: { env: staging, service: frontend }
      - targets:
          - http://host.docker.internal:3100
        labels: { env: production, service: frontend }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
